name: Build Test

on:
    schedule:
        # 12:00AM (UTC) Sunday
        - cron: '0 0 * * SUN'
    workflow_dispatch:

jobs:
    trigger-build:
        name: Build (Trigger) - ${{ inputs.os }}
        uses: ./.github/workflows/reusable_build.yml
        if: ${{ always() }}
        strategy:
            matrix:
                os: [ubuntu-22.04, windows-2022, macos-13]
            fail-fast: true
        with:
            os: ${{ matrix.os }}
            stage: prod
        secrets: inherit
